[package]
name = "router-island-desktop"
version = "0.1.0"
description = "Router Island — OpenRouter credits widget"
authors = ["aitorru"]
edition = "2021"

[lib]
name = "router_island_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TLS chosen per platform so every CI target builds without exotic tooling:
#   Windows -> native-tls (SChannel, no OpenSSL, no NASM)
#   Linux   -> rustls (no system OpenSSL needed; works on x64 and arm64)
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
